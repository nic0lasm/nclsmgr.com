name: nclsmgr

# Journaux des conteneurs dans journald, qui les garde 30 jours au plus (conserver-journaux.sh).
# docker logs les lit toujours.
x-journal: &journal
  driver: journald
  options:
    tag: "{{.Name}}"

services:
  web:
    image: ghcr.io/nic0lasm/nclsmgr.com:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *journal
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    environment:
      ESPACE_BASE: /data/base/espace.db
    # UMAMI_SITE_ID, écrit par installer-statistiques.sh ; sans lui, aucun script de mesure.
    env_file:
      - path: /etc/nclsmgr/statistiques.env
        required: false
    volumes:
      - base:/data/base
      - prive:/data/prive
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [interne]

  # Seul service à sortir sur Internet, seul détenteur du secret SMTP. Activé par le déployeur
  # lorsque /etc/nclsmgr/smtp.json existe (voir configurer-smtp.sh).
  courrier:
    image: ghcr.io/nic0lasm/nclsmgr.com:${IMAGE_TAG:-latest}
    profiles: [courrier]
    command: ["node", "courrier.cjs"]
    # Node n'est pas PID 1 : les signaux d'arrêt lui parviennent normalement.
    init: true
    # Un envoi en cours peut durer jusqu'à 60 s : on le laisse finir pour ne pas l'envoyer deux fois.
    stop_grace_period: 75s
    restart: unless-stopped
    logging: *journal
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      ESPACE_BASE: /data/base/espace.db
    volumes:
      - base:/data/base
      - /etc/nclsmgr/smtp.json:/run/secrets/smtp:ro
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "process.exit(Date.now()-require('fs').statSync('/tmp/courrier-vivant').mtimeMs<120000?0:1)"
      interval: 60s
      timeout: 5s
      retries: 3
      # Couvre l'attente de la migration de la base par le service web.
      start_period: 5m
      start_interval: 5s
    networks: [sortie]

  # Mesure d'audience sans cookie ni adresse IP conservée. Activée par le déployeur
  # lorsque /etc/nclsmgr/umami.env existe (voir installer-statistiques.sh).
  umami:
    image: ghcr.io/umami-software/umami:3.4.0@sha256:85909afc45bdcda1917394594a087421fdbb05610fded0fa9f6fb861abb2f367
    profiles: [statistiques]
    restart: unless-stopped
    logging: *journal
    depends_on:
      umami-db:
        condition: service_healthy
    env_file:
      - path: /etc/nclsmgr/umami.env
        required: false
    environment:
      DISABLE_TELEMETRY: "1"
      DISABLE_UPDATES: "1"
      CHECKPOINT_DISABLE: "1"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/heartbeat').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 2m
      start_interval: 5s
    # Aucun accès à Internet : Caddy le joint sur interne, la base sur statistiques.
    networks: [interne, statistiques]

  umami-db:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    profiles: [statistiques]
    restart: unless-stopped
    logging: *journal
    env_file:
      - path: /etc/nclsmgr/umami-db.env
        required: false
    volumes:
      - umami_db:/var/lib/postgresql/data
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 2s
    networks: [statistiques]

  caddy:
    image: caddy:2-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    restart: unless-stopped
    logging: *journal
    depends_on: [web]
    ports:
      - "443:443"
      # Tableau de bord Umami, joignable uniquement par tunnel SSH.
      - "127.0.0.1:3001:3001"
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./cloudflare-ips.caddy:/etc/caddy/cloudflare-ips.caddy:ro
      - /etc/nclsmgr/certs:/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [interne, public]

networks:
  interne:
    internal: true
  public: {}
  sortie: {}
  statistiques:
    internal: true

volumes:
  # Base de l'espace privé, partagée avec le service courrier.
  base: {}
  # Documents réservés, lus par le seul service web.
  prive: {}
  umami_db: {}
  caddy_data: {}
  caddy_config: {}
