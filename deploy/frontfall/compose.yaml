# Projet Compose du jeu Frontfall, installé dans /opt/frontfall par installer-frontfall.sh.
# Le dépôt du jeu ne choisit que l'étiquette de l'image : ce fichier reste sous la main de ce dépôt.
name: frontfall

services:
  frontfall:
    image: ghcr.io/nic0lasm/frontfall:${IMAGE_TAG:?IMAGE_TAG manquant}
    restart: unless-stopped
    logging:
      driver: journald
      options:
        tag: "{{.Name}}"
    # Laisse au serveur le temps de prévenir les joueurs et de fermer les websockets.
    init: true
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp
    environment:
      NODE_ENV: production
      PORT: "8080"
      FRONTFALL_ORIGINE: https://nclsmgr.com
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    cpus: 2
    pids_limit: 256
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 1m
      start_interval: 2s
    # Seul réseau du jeu : Caddy le joint ici, et il n'a aucun accès à Internet.
    networks: [frontfall]

networks:
  frontfall:
    external: true
