version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: main
    schedule:
      interval: weekly
    groups:
      dependances:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # Les types Node suivent la version majeure de Node utilisée (.nvmrc).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: chore
  - package-ecosystem: docker
    directory: /
    target-branch: main
    schedule:
      interval: weekly
    ignore:
      # Rester sur la version LTS de Node : la montée de version majeure se fait à la main.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: chore
  - package-ecosystem: docker-compose
    directory: /deploy
    target-branch: main
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
