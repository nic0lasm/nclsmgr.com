name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualite:
    name: Qualité et tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm build:courrier
      - name: Préparer le serveur autonome
        run: cp -r .next/static .next/standalone/.next/
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  caddy:
    name: Configuration Caddy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Valider le Caddyfile
        run: |
          mkdir -p /tmp/certs
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=nclsmgr.com" \
            -addext "subjectAltName=DNS:nclsmgr.com,DNS:www.nclsmgr.com" \
            -keyout /tmp/certs/origin-key.pem -out /tmp/certs/origin.pem
          v4=$(curl -fsS https://www.cloudflare.com/ips-v4)
          v6=$(curl -fsS https://www.cloudflare.com/ips-v6)
          echo "trusted_proxies static $(echo $v4 $v6)" > /tmp/cloudflare-ips.caddy
          image=$(grep -oE 'image: caddy:[^ ]+' deploy/compose.yaml | cut -d' ' -f2)
          docker run --rm \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -v "/tmp/cloudflare-ips.caddy:/etc/caddy/cloudflare-ips.caddy:ro" \
            -v /tmp/certs:/certs:ro \
            "$image" caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Vérifier les en-têtes servis et transmis
        run: |
          image=$(grep -oE 'image: caddy:[^ ]+' deploy/compose.yaml | cut -d' ' -f2)
          docker network create essai
          docker run -d --name web --network essai \
            -v "$PWD/deploy/essais/web-factice.caddy:/etc/caddy/Caddyfile:ro" "$image"
          docker run -d --name frontfall --network essai \
            -v "$PWD/deploy/essais/frontfall-factice.caddy:/etc/caddy/Caddyfile:ro" "$image"
          docker run -d --name caddy --network essai -p 8443:443 \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -v "/tmp/cloudflare-ips.caddy:/etc/caddy/cloudflare-ips.caddy:ro" \
            -v /tmp/certs:/certs:ro "$image"
          # Seconde instance qui tient les adresses privées, donc l'essai, pour une plage Cloudflare.
          echo "trusted_proxies static private_ranges" > /tmp/cloudflare-essai.caddy
          docker run -d --name caddy-cf --network essai -p 8444:443 \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -v "/tmp/cloudflare-essai.caddy:/etc/caddy/cloudflare-ips.caddy:ro" \
            -v /tmp/certs:/certs:ro "$image"
          for p in 8443 8444; do
            for _ in $(seq 30); do
              curl -sk --resolve "nclsmgr.com:$p:127.0.0.1" -o /dev/null "https://nclsmgr.com:$p/fr" && break
              sleep 1
            done
          done
          sh deploy/essais/verifier-en-tetes.sh 8443 8444 || { docker logs caddy; docker logs caddy-cf; exit 1; }

  image:
    name: Image et analyse de vulnérabilités
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: nclsmgr:ci
      - name: Démarrer l'image comme en production
        run: |
          docker run -d --name essai --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --tmpfs /tmp --tmpfs /app/.next/cache \
            --tmpfs /data/base:uid=1000,gid=1000,mode=700 \
            -e ESPACE_BASE=/data/base/espace.db \
            -p 127.0.0.1:3000:3000 nclsmgr:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/healthz; then exit 0; fi
            sleep 1
          done
          docker logs essai
          exit 1
      - name: Service courrier présent et base SQLite chargeable
        run: |
          docker run --rm --read-only --cap-drop ALL nclsmgr:ci node -e \
            "require('fs').accessSync('courrier.cjs'); new (require('better-sqlite3'))(':memory:').prepare('select 1').get()"
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: nclsmgr:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
