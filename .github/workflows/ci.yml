name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualite:
    name: Qualité et tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Préparer le serveur autonome
        run: cp -r .next/static .next/standalone/.next/
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  caddy:
    name: Configuration Caddy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Valider le Caddyfile
        run: |
          mkdir -p /tmp/certs
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=nclsmgr.com" \
            -keyout /tmp/certs/origin-key.pem -out /tmp/certs/origin.pem
          image=$(grep -oE 'image: caddy:[^ ]+' deploy/compose.yaml | cut -d' ' -f2)
          docker run --rm \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -v "$PWD/deploy/cloudflare-ips.caddy:/etc/caddy/cloudflare-ips.caddy:ro" \
            -v /tmp/certs:/certs:ro \
            "$image" caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  image:
    name: Image et analyse de vulnérabilités
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: nclsmgr:ci
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: nclsmgr:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
