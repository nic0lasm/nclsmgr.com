name: Audit externe

# Vue de l'extérieur, telle qu'un visiteur ou un scanner la voit : DNS derrière Cloudflare,
# note Mozilla Observatory et note SSL Labs. Un écart fait échouer le workflow, ce qui envoie un
# courriel au propriétaire. Lancé à la main après un changement, et chaque mois.
on:
  schedule:
    - cron: "41 5 1 * *"
  workflow_dispatch:

permissions: {}

jobs:
  audit:
    name: Audit externe
    if: github.event_name == 'workflow_dispatch' || vars.SURVEILLANCE_ACTIVE == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Adresses publiques dans les plages Cloudflare
        run: |
          curl -fsS https://www.cloudflare.com/ips-v4 > plages
          echo >> plages
          curl -fsS https://www.cloudflare.com/ips-v6 >> plages
          for nom in nclsmgr.com www.nclsmgr.com; do
            for type in A AAAA; do
              dig +short "$type" "$nom" | sed "s/^/$nom $type /"
            done
          done > adresses
          cat adresses
          python3 - <<'PY'
          import ipaddress
          plages = [ipaddress.ip_network(l.strip()) for l in open("plages") if l.strip()]
          # dig +short donne aussi les CNAME intermédiaires, qui finissent par un point.
          lignes = [l.split() for l in open("adresses") if l.strip() and not l.strip().endswith(".")]
          hors = [l for l in lignes if not any(ipaddress.ip_address(l[2]) in p for p in plages)]
          if not lignes or hors:
              raise SystemExit(f"Adresse hors Cloudflare ou absente : {hors or 'aucune réponse'}")
          print("Toutes les adresses publiques sont des adresses Cloudflare.")
          PY

      - name: En-têtes servis
        run: |
          echecs=0
          lire() { curl -sS --max-time 20 -o /dev/null -D - "$@" | tr -d '\r'; }
          attendu() {
            if printf '%s\n' "$2" | grep -qiE -- "$3"; then echo "ok $1"; else echo "ÉCHEC $1"; echecs=$((echecs + 1)); fi
          }
          interdit() {
            if printf '%s\n' "$2" | grep -qiE -- "$3"; then echo "ÉCHEC $1"; echecs=$((echecs + 1)); else echo "ok $1"; fi
          }

          page=$(lire https://nclsmgr.com/fr)
          printf '%s\n' "$page"
          attendu "HSTS deux ans, sous-domaines compris" "$page" '^strict-transport-security: max-age=63072000; includeSubDomains'
          attendu "CSP à nonce" "$page" "^content-security-policy: .*script-src 'self' 'nonce-[A-Za-z0-9+/=]+' 'strict-dynamic'"
          attendu "CSP sans cadre parent" "$page" "^content-security-policy: .*frame-ancestors 'none'"
          attendu "X-Content-Type-Options" "$page" '^x-content-type-options: nosniff'
          attendu "X-Frame-Options" "$page" '^x-frame-options: DENY'
          attendu "Referrer-Policy" "$page" '^referrer-policy: strict-origin-when-cross-origin'
          attendu "Permissions-Policy" "$page" '^permissions-policy: camera=\(\)'
          interdit "aucun X-Powered-By" "$page" '^x-powered-by:'
          interdit "ni Caddy ni Next.js dans Server" "$page" '^server: .*(caddy|next)'
          # Un nonce resservi (page mise en cache) annulerait la politique.
          n1=$(printf '%s\n' "$page" | grep -oE "'nonce-[^']+'" | head -1)
          n2=$(lire https://nclsmgr.com/fr | grep -oE "'nonce-[^']+'" | head -1)
          if [ -n "$n1" ] && [ "$n1" != "$n2" ]; then echo "ok nonce renouvelé à chaque réponse"; else echo "ÉCHEC nonce absent ou resservi"; echecs=$((echecs + 1)); fi

          # Un en-tête interne de Next.js envoyé de l'extérieur ne doit pas contourner le proxy.
          contournement=$(lire -H "X-Middleware-Subrequest: $(printf 'middleware:src/middleware:proxy:src/proxy:%.0s' 1 2 3 4 5)" https://nclsmgr.com/fr)
          attendu "X-Middleware-Subrequest sans effet" "$contournement" "^content-security-policy: .*'nonce-"

          acces=$(lire https://nclsmgr.com/fr/p)
          attendu "page d'accès : noindex" "$acces" '^x-robots-tag: noindex'
          attendu "page d'accès : no-store" "$acces" '^cache-control: no-store'
          attendu "page d'accès : Referrer-Policy same-origin" "$acces" '^referrer-policy: same-origin'
          espace=$(lire https://nclsmgr.com/fr/espace)
          attendu "espace sans session : 404" "$espace" '^HTTP/[0-9.]+ 404'
          attendu "espace : noindex" "$espace" '^x-robots-tag: noindex'
          attendu "espace : private, no-store" "$espace" '^cache-control: private, no-store'

          attendu "HTTP renvoyé vers HTTPS" "$(lire http://nclsmgr.com/fr)" '^location: https://nclsmgr\.com/fr$'
          attendu "www renvoyé vers le domaine nu" "$(lire https://www.nclsmgr.com/fr)" '^location: https://nclsmgr\.com/fr$'
          stats=$(curl -sS -L --max-time 20 -o /dev/null -w '%{http_code}' https://nclsmgr.com/stats/api/websites)
          attendu "tableau de bord des statistiques fermé" "$stats" '^404$'
          attendu "security.txt" "$(curl -sS --max-time 20 https://nclsmgr.com/.well-known/security.txt)" '^Contact: '

          [ "$echecs" -eq 0 ]

      - name: Mozilla Observatory
        run: |
          curl -fsS -X POST "https://observatory-api.mdn.mozilla.net/api/v2/scan?host=nclsmgr.com" > observatory.json
          python3 - <<'PY'
          import json
          r = json.load(open("observatory.json"))
          print(f"Note {r.get('grade')} ({r.get('score')}/100), tests échoués : {r.get('tests_failed')}")
          print(r.get("details_url", ""))
          if r.get("grade") != "A+":
              raise SystemExit("Note Observatory inférieure à A+.")
          PY

      - name: SSL Labs
        run: |
          api=https://api.ssllabs.com/api/v3/analyze
          curl -fsS "$api?host=nclsmgr.com&startNew=on&all=done" > /dev/null
          for _ in $(seq 1 60); do
            sleep 15
            curl -fsS "$api?host=nclsmgr.com&all=done" > ssllabs.json
            etat=$(jq -r .status ssllabs.json)
            [ "$etat" = READY ] || [ "$etat" = ERROR ] && break
          done
          jq -r '"État : \(.status)", (.endpoints[]? | "\(.ipAddress) : \(.grade // .statusMessage)")' ssllabs.json
          jq -e '.status == "READY" and (.endpoints | length > 0) and all(.endpoints[]; .grade == "A+")' ssllabs.json > /dev/null \
            || { echo "Note SSL Labs inférieure à A+ ou analyse incomplète."; exit 1; }
